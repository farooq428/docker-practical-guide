services:
  frontend:
    build: ./frontend
    container_name: react-container
    ports:
      - "5173:5173"
    
    restart: always

    working_dir: /app
    
    depends_on:
      - backend


  backend:
    build: ./backend
    container_name: express-container
    environment:
      PORT: 5000
      JWT_SECRET: abcjwt
    ports:
      - "5000:5000"  
    working_dir: /app  
    restart: always  
